<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>皇者天下 - 英雄配裝工具</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c8a84b;
      --gold-bright: #e8c96a;
      --gold-dim: #7a6020;
      --bg-deep: #0a0c0a;
      --bg-panel: #0d120e;
      --bg-card: #111810;
      --bg-card-hover: #182018;
      --sidebar-w: 200px;
      --border: #1e2e1a;
      --text: #b8c8b0;
      --text-dim: #4a5e44;
    }

    body {
      font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    /* ===== 推薦裝備左側面板 ===== */
    @keyframes slideInLeft {
      from { transform: translateX(-100%); opacity: 0.5; }
      to   { transform: translateX(0);     opacity: 1; }
    }
    .equip-close-btn:hover { color: var(--gold-bright); }
    .equip-slot {
      margin-bottom: 20px;
    }
    .equip-slot-label {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .equip-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      transition: border-color 0.2s;
    }
    .equip-item:hover { border-color: var(--gold-dim); }
    .equip-item-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--gold-bright);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .equip-item-effect {
      font-size: 13px;
      color: var(--text);
      line-height: 1.7;
      letter-spacing: 0.5px;
    }
    .equip-item-reason {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 6px;
      font-style: italic;
    }
    .equip-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      font-size: 15px;
      letter-spacing: 2px;
    }
    .equip-empty-icon { font-size: 40px; opacity: 0.3; margin-bottom: 12px; }

    .equip-note {
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 1px;
      line-height: 1.6;
      background: rgba(255,255,255,0.03);
      border-left: 2px solid var(--gold-dim);
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 20px;
      font-style: italic;
    }

    .equip-section-label {
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--text-dim);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .baowu-slot {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 8px;
      text-align: center;
      transition: border-color 0.2s;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .baowu-slot:hover { border-color: var(--gold-dim); }
    .baowu-slot-type {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-dim);
      background: rgba(255,255,255,0.04);
      padding: 2px 8px;
      border-radius: 10px;
      width: 100%;
    }
    .baowu-slot-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold-bright);
      letter-spacing: 1px;
      line-height: 1.4;
    }
    .baowu-slot-effect {
      font-size: 11px;
      color: var(--text);
      line-height: 1.6;
      letter-spacing: 0.3px;
    }
    .skill-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 32px;
    }
    .skill-slot {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 10px;
      text-align: center;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.2s;
    }
    .skill-slot:hover { border-color: #4a8abf; }
    .skill-slot-name {
      font-size: 14px;
      font-weight: 700;
      color: #a0d4ff;
      letter-spacing: 1px;
    }
    .skill-slot-level {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }
    .skill-slot-empty {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .beast-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }
    .beast-col-label {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--gold-bright);
      text-align: center;
      margin-bottom: 8px;
      opacity: 0.7;
    }
    .beast-col { display: flex; flex-direction: column; gap: 8px; }
    .beast-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .beast-slot {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 10px;
      text-align: center;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: border-color 0.2s;
    }
    .beast-slot:hover { border-color: #8a5abf; }
    .beast-slot-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--text-dim);
      background: rgba(255,255,255,0.04);
      padding: 2px 8px;
      border-radius: 10px;
      width: 100%;
    }
    .beast-slot-name {
      font-size: 13px;
      font-weight: 700;
      color: #c0a0ff;
      letter-spacing: 1px;
    }
    .beast-slot-effect {
      font-size: 11px;
      color: var(--text);
      line-height: 1.6;
    }
    .beast-slot-empty {
      font-size: 11px;
      color: var(--text-dim);
      margin: auto;
    }

    .deputy-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 32px;
    }
    .deputy-slot:hover { border-color: var(--gold-dim); }
    .deputy-slot-label {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-dim);
      background: rgba(255,255,255,0.04);
      padding: 2px 8px;
      border-radius: 10px;
      width: 100%;
    }
    .deputy-slot-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--gold-bright);
      letter-spacing: 2px;
    }
    .deputy-slot-effect {
      font-size: 11px;
      color: var(--text);
      line-height: 1.6;
    }

    .baowu-slot-empty {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
      margin-top: auto;
      margin-bottom: auto;
    }

    /* ===== 左側選單 ===== */
    .sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0;
      z-index: 100;
    }

    .sidebar-logo {
      padding: 28px 20px 20px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .sidebar-logo .title {
      font-size: 24px;
      font-weight: 900;
      color: var(--gold-bright);
      letter-spacing: 4px;
      text-shadow: 0 0 18px rgba(255,215,0,0.4);
      line-height: 1.4;
    }
    .sidebar-logo .subtitle {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 2px;
      margin-top: 4px;
    }

    .sidebar-nav {
      padding: 16px 12px;
      flex: 1;
    }
    .nav-section-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--text-dim);
      padding: 8px 8px 6px;
      text-transform: uppercase;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-dim);
      transition: all 0.2s;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .nav-item:hover {
      background: var(--bg-card);
      color: var(--text);
    }
    .nav-item.active {
      background: rgba(212, 168, 75, 0.12);
      color: var(--gold-bright);
      border-color: rgba(212, 168, 75, 0.25);
      font-weight: 700;
    }
    .nav-item .icon {
      font-size: 18px;
      width: 22px;
      text-align: center;
    }
    .nav-item .badge {
      margin-left: auto;
      background: var(--gold-dim);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      letter-spacing: 1px;
    }

    /* ===== 主內容區 ===== */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      padding: 20px 32px 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-title {
      font-size: 28px;
      font-weight: 900;
      color: var(--gold-bright);
      letter-spacing: 3px;
      margin-bottom: 16px;
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-bottom: 16px;
    }
    .filter-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .filter-sep {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 4px;
    }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    .filter-btn:hover {
      border-color: var(--gold-dim);
      color: var(--text);
    }
    .filter-btn.active {
      background: rgba(212,168,75,0.15);
      border-color: var(--gold);
      color: var(--gold-bright);
      font-weight: 700;
    }

    .search-wrap {
      margin-left: auto;
      position: relative;
    }
    .search-wrap .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 14px;
    }
    #search, #baowuSearch {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 8px 16px 8px 34px;
      width: 200px;
      outline: none;
      transition: border-color 0.2s;
    }
    #search:focus, #baowuSearch:focus {
      border-color: var(--gold-dim);
    }
    #search::placeholder, #baowuSearch::placeholder {
      color: var(--text-dim);
    }

    /* ===== 英雄格 ===== */
    .content {
      padding: 24px 32px;
      flex: 1;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }
    .hero-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--rarity-color, var(--border));
      transition: opacity 0.2s;
      opacity: 0;
    }
    .hero-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--gold-dim);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .hero-card:hover::before { opacity: 1; }

    .hero-card[data-rarity="國士"] { --rarity-color: #d4a84b; }
    .hero-card[data-rarity="名將"] { --rarity-color: #7b9bd4; }
    .hero-card[data-rarity="良才"] { --rarity-color: #6daa6d; }
    .hero-card[data-rarity="巾幗"] { --rarity-color: #d4789a; }

    .rarity-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    [data-rarity="國士"] .rarity-dot { background: #d4a84b; }
    [data-rarity="名將"] .rarity-dot { background: #7b9bd4; }
    [data-rarity="良才"] .rarity-dot { background: #6daa6d; }
    [data-rarity="巾幗"] .rarity-dot { background: #d4789a; }

    .hero-name {
      font-size: 20px;
      font-weight: 700;
      color: #e8d9b0;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .hero-meta {
      font-size: 14px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }
    .hero-stats-mini {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }
    .stat-chip {
      font-size: 13px;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255,255,255,0.05);
      color: var(--text-dim);
    }
    .stat-chip span { color: var(--text); font-weight: 700; }

    .no-result {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
      font-size: 16px;
      letter-spacing: 2px;
    }

    /* ===== 寶物頁 ===== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 20px;
      color: var(--text-dim);
      text-align: center;
      gap: 16px;
    }
    .empty-icon { font-size: 52px; opacity: 0.3; }
    .empty-title { font-size: 18px; letter-spacing: 3px; }
    .empty-sub { font-size: 13px; letter-spacing: 1px; }

    /* ===== Modal ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      backdrop-filter: blur(3px);
    }
    .modal-content {
      position: absolute;
      top: 0; right: 0;
      width: min(520px, 100%);
      height: 100%;
      background: var(--bg-panel);
      border-left: 1px solid var(--gold-dim);
      overflow-y: auto;
      box-shadow: -8px 0 40px rgba(0,0,0,0.6);
      animation: slideIn 0.28s cubic-bezier(0.22,1,0.36,1);
      display: flex;
      flex-direction: column;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0.5; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    .modal-header {
      background: linear-gradient(160deg, rgba(200,168,75,0.12), rgba(200,168,75,0.02));
      padding: 36px 32px 24px;
      border-bottom: 1px solid var(--border);
      position: relative;
      flex-shrink: 0;
    }
    .modal-rarity-bar {
      height: 3px;
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .modal-name {
      font-size: 34px;
      font-weight: 900;
      color: var(--gold-bright);
      letter-spacing: 4px;
      margin-bottom: 10px;
    }
    .modal-type-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 14px;
      letter-spacing: 2px;
      margin-right: 6px;
    }
    .close-btn {
      position: absolute;
      top: 20px; right: 24px;
      font-size: 26px;
      cursor: pointer;
      color: var(--text-dim);
      transition: color 0.2s;
      background: none;
      border: none;
      font-family: inherit;
      line-height: 1;
    }
    .close-btn:hover { color: var(--gold-bright); }
    .equip-open-btn:hover {
      background: rgba(200,168,75,0.22);
      border-color: var(--gold-bright);
    }

    .modal-body { padding: 28px 32px 40px; flex: 1; }
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 17px;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--text-dim); letter-spacing: 1px; }
    .stat-bar-wrap { flex: 1; margin: 0 16px; height: 4px; background: var(--border); border-radius: 2px; }
    .stat-bar { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright)); transition: width 0.6s ease; }
    .stat-val { font-weight: 700; color: var(--gold-bright); min-width: 30px; text-align: right; font-size: 18px; }

    .skill-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .skill-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .skill-name {
      font-size: 18px;
      font-weight: 900;
      color: var(--gold-bright);
      letter-spacing: 3px;
      margin-bottom: 12px;
    }
    .skill-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .skill-item {
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
      letter-spacing: 0.5px;
      background: rgba(255,255,255,0.03);
      border-left: 2px solid #c8a84b;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      position: relative;
    }

    .awaken-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .awaken-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .awaken-name {
      font-size: 18px;
      font-weight: 900;
      color: #a0d4ff;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }
    .awaken-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .awaken-item {
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
      letter-spacing: 0.5px;
      background: rgba(100,160,255,0.05);
      border-left: 2px solid #4a8abf;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
    }

    .reincarn-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .reincarn-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .reincarn-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .reincarn-item {
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
      letter-spacing: 0.5px;
      background: rgba(180,120,255,0.05);
      border-left: 2px solid #8a5abf;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
    }

    .destiny-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .destiny-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .destiny-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .destiny-item {
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
      letter-spacing: 0.5px;
      background: rgba(255,160,80,0.05);
      border-left: 2px solid #bf7a30;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
    }
    .destiny-name {
      color: #e8c080;
      font-weight: 700;
    }

    .note-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .note-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .note-text {
      font-size: 15px;
      color: var(--text);
      line-height: 1.9;
      letter-spacing: 1px;
      background: rgba(255,255,255,0.03);
      border-left: 2px solid #4a7a4a;
      padding: 12px 16px;
      border-radius: 0 6px 6px 0;
      font-style: italic;
    }
    .note-empty {
      font-size: 13px;
      color: var(--text-dim);

      { id: "liushan",  name: "神·劉禪",   type: "文官", rarity: "國士", force: 79,  intel: 91,  charm: 97, command: 88, talent: "幼年劫難有驚無險，順繼蜀漢群臣環伺。至尊強運當屬阿斗，樂不思蜀有苦自知。", skillName: "福澤後主", skills: ["可擔當任意英雄的任意兵種副將", "作為副將時，可依照劉禪品質，為主將提供額外加成", "受到反噬類效果時，減免 15% 損失；紫色以上品質：近戰回合受到的傷害 -5%；金色以上品質：魅力 +1，統御 +1；紅色品質：遠戰回合受到的傷害 -5%；劉禪自身作為主將時，更可依照品質，解鎖以上全部 4 倍的加成效果"], awakens: ["從戰鬥開始起，每回合我方英雄行動結束時，若我方存在至少 1 個增益狀態，可發動【樂不思蜀】，消滅敵方前軍和後軍最大兵力的 8%", "若【福佑】達到 20 級，智力 +5，魅力 +5，【福佑】在戰鬥開始時的發動幾率 +30%，且近戰首回合可額外發動一次【福佑】"], reincarn: ["敵方發動任意英雄技時，若其兵力不足一半，則劉禪發動【大智若愚】，阻止敵方技能發動", "英雄可自由分配四維 +2", "英雄主動技能位 +1", "全軍免傷 +8%", "英雄可自由分配四維 +4"], destiny: [{name:"亞父守護", hero:"諸葛亮", effect:"同時上陣，福佑的護盾量提升 300%"}, {name:"單騎救主", hero:"趙雲", effect:"對武將傷害 +20%"}, {name:"賢內勇外", hero:"張星彩", effect:"傷害 +10%"}, {name:"虎父犬子", hero:"劉備", effect:"受到傷害 -10%"}] },
      { id: "xuchu",    name: "神·許褚",   type: "武將", rarity: "名將", force: 96,  intel: 61,  charm: 67, command: 80, talent: "典韋的繼任者，力大無窮。曾于談判中嚇退馬超，虎癡之名從此為天下稱道。", skillName: "裸衣虎癡", skills: ["戰鬥中，己方步兵每受到一次敵方傷害，攻擊就提升 5%（最多 30%）", "每提升 1 級【反擊】，前後軍兵力各 +10"], awakens: ["遠戰第二回合許褚發動【癡戰】，令己方傷兵戰意狂漲前仆後繼，立即治療 90% 的傷兵", "每提升 1 級【盾牆】，步兵攻防 +20"], reincarn: ["步兵傷害和免傷 +15%。遠戰首回合，己方步兵每次受到敵方部隊的攻擊，都可發動【虎軀無畏】，自損 15% 的當前兵力（對戰NPC時不損失兵力），消滅攻擊來源 50% 的當前兵力", "英雄可自由分配四維 +2", "英雄主動技能位 +1", "我方的不良狀態抗性 +10%", "英雄可自由分配四維 +4"], destiny: [{name:"舉火鏖戰", hero:"馬超", effect:"同時上陣，【激戰】傷害提升 30%"}, {name:"虎癡惡鬼", hero:"典韋", effect:"對全才傷害 +18%"}, {name:"堅不可摧", hero:"曹仁", effect:"前軍對弓兵傷害 +20%"}] },
      { id: "zhangfei", name: "神·張飛",   type: "武將", rarity: "名將", force: 99,  intel: 71,  charm: 74, command: 90, talent: "蜀漢虎將，性格暴烈，武藝高強，百萬軍中取上將首級如探囊取物。但待人處事粗中有細。", skillName: "粗中有細", skills: ["【暴烈】傷害 +10%，且禁止任何對手的【策謀】技能生效", "每提升 1 級【暴烈】，減免 1% 文官或全才造成的傷害（最多減免 20%）"], awakens: ["若武力高於對手，己方發起的智力、魅力、統御比拼亦算勝出", "若【捨身】達到 15 級，武力 +2，騎兵暴擊率 +40%"], reincarn: ["遠戰首回合發動【燕人怒吼】，震懾敵膽，使敵方部隊在接下來的 2 回合，無法發動任何兵種主被動技能，並導致【潰逃】，持續 2 回合", "英雄可自由分配四維 +2", "英雄主動技能位 +1", "全軍免傷 +8%", "英雄可自由分配四維 +4"], destiny: [{name:"桃園之義", hero:"關羽", effect:"同時上陣，騎兵攻擊提升 30%"}, {name:"各為其主", hero:"張郃", effect:"對全才傷害 +18%"}, {name:"遠親之情", hero:"夏侯霸", effect:"後軍對騎兵傷害 +20%"}] },

      { id: "xiahoudun",name: "神·夏侯惇", type: "武將", rarity: "名將", force: 93,  intel: 75,  charm: 83, command: 90, talent: "曹操心腹猛將，拔矢啖睛的事蹟流傳千古。但平日裡虛心求學，為人簡樸，愛惜士卒。", skillName: "拔矢啖睛", skills: ["戰鬥中，己方騎兵每受到一次敵方後軍傷害，攻擊就提升 10%（最多提升 40%）", "每提升 1 級【不屈】，騎兵基礎攻擊 +3，騎兵暴擊率 +2%"], awakens: ["【鐵蹄】在所有回合都能發動，且效果提升 35%", "若【暴烈】達到 15 級，武力 +6，魅力 +10，且受到文官傷害 -40%"], reincarn: ["遠戰第二回合若敵方仍有弓兵存活，我方發動【一箭之仇】，以我方騎兵攻擊力的 100% 作為傷害，對敵方弓兵造成致命打擊（無視免傷和防禦）", "英雄可自由分配四維 +2", "英雄主動技能位 +1", "騎兵的不良狀態抗性 +20%", "英雄可自由分配四維 +4"], destiny: [{name:"兄弟情深", hero:"夏侯淵", effect:"同時上陣，騎兵攻擊提升 15%，防禦提升 15%"}, {name:"文韜武略", hero:"荀彧", effect:"對全才傷害 +18%"}, {name:"柱國棟樑", hero:"程普", effect:"前軍對步兵傷害 +20%"}] },

      { id: "lumeng",   name: "神·呂蒙",   type: "全才", rarity: "名將", force: 87,  intel: 93,  charm: 83, command: 95, talent: "原為吳下阿蒙，以膽氣稱。後讀史為鑒，終成大將。也因此白衣渡江，拿下荊州。", skillName: "吳下阿蒙", skills: ["統御高於對手時，免傷 +20%", "每提升 1 級【兵法】，英雄主動技能傷害提升 5%"], awakens: ["【乾坤】可同時攻擊敵軍全體，且每提升 1 級【乾坤】，方士被動免傷 +3%（最高免傷 75%）", "若【軍略】達到 15 級，統御 +5，智力 +6，武力 +8"], reincarn: ["當敵方剩餘總兵力低於 25% 時，我方發動【士別三日】，直接消滅敵方部隊，並宣告勝利", "英雄可自由分配四維 +2", "英雄主動技能位 +1", "英雄技傷害 +20%", "英雄可自由分配四維 +4"], destiny: [{name:"士別三日", hero:"魯肅", effect:"同時上陣，方士攻擊提升 15%，速度提升 10"}, {name:"升堂拜母", hero:"諸葛瑾", effect:"對文官傷害 +18%"}, {name:"身先軍陣", hero:"周泰", effect:"前軍傷害 +20%"}] },

      { id: "huangzhong",name: "神·黃忠",   type: "武將", rarity: "名將", force: 93,  intel: 80,  charm: 75, command: 92, talent: "年過花甲才名傳天下的老將軍。箭術無雙，可拉兩石之弓，乃老當益壯的典範。", skillName: "老當益壯", skills: ["英雄等級每提升 1 級，攻擊和防禦額外提升 0.5%（最多提升 30%）", "每提升 1 級【強弩】，【火箭】技能傷害提升 1%（最多 20%）"], awakens: ["弓兵基礎攻擊 +200，戰鬥開始，己方弓兵就能額外發動一次超強力【遠射】", "若【不屈】達到 15 級，【回射】可同時攻擊敵軍全體，且傷害加倍"], reincarn: ["弓兵免傷 +20%，每提升 1 點武力，弓兵基礎攻擊 +3，弓兵的不良狀態抗性 +1%", "英雄可自由分配四維 +2", "英雄主動技能位 +1", "弓兵傷害 +25%", "英雄可自由分配四維 +4"], destiny: [{name:"惺惺相惜", hero:"趙雲", effect:"同時上陣，弓兵攻擊提升 30%"}, {name:"老當益壯", hero:"法正", effect:"對全才傷害 +18%"}, {name:"斬于馬下", hero:"夏侯淵", effect:"後軍對方士傷害 +20%"}] },
      { id: "weiyan",    name: "魏延",   type: "武將", rarity: "名將", force: 92,  intel: 76,  charm: 70, command: 87, talent: "蜀漢大將，有勇有謀，深受劉備器重。曾獻子午谷奇謀于孔明，卻因過於冒險而棄用。", skillName: "出其不意", skills: ["遠戰首回合有 50% 幾率發動一次【衝鋒】，且【衝鋒】技能傷害提高 20%", "每提升 1 級【衝鋒】，步兵基礎攻擊 +3"] },

      { id: "xushu",     name: "徐庶",   type: "文官", rarity: "名將", force: 67,  intel: 95,  charm: 84, command: 85, talent: "初為劉備帳下謀士，擅長臨陣破敵，一改劉備連戰皆敗的頹勢。但因母被曹操所獲而出仕曹操。", skillName: "折節學問", skills: ["對戰武將時，免傷 +15%", "每提升 1 級【回射】，減免 2% 的英雄主動技能傷害（最多減免 40%）"] },

      { id: "huaman",    name: "神·花鬘",   type: "武將", rarity: "巾幗", force: 95,  intel: 88,  charm: 98,  command: 80 }
    ];

    const rarityColor = { "國士": "#d4a84b", "名將": "#7b9bd4", "良才": "#6daa6d", "巾幗": "#d4789a" };
    const rarityBg    = { "國士": "rgba(212,168,75,0.15)",  "名將": "rgba(123,155,212,0.15)", "良才": "rgba(109,170,109,0.15)", "巾幗": "rgba(212,120,154,0.15)" };
    const jobColor    = { "文官": "#e8a0a0", "全才": "#a0d4b8", "武將": "#a0b8e8" };

    let currentRarity = "all";
    let currentJob    = "all";

    document.getElementById('heroBadge').textContent = heroes.length;

    function switchTab(tab) {
      document.getElementById('heroPage').style.display  = tab === 'hero'  ? 'block' : 'none';
      document.getElementById('baowuPage').style.display = tab === 'baowu' ? 'block' : 'none';
      document.getElementById('navHero').classList.toggle('active',  tab === 'hero');
      document.getElementById('navBaowu').classList.toggle('active', tab === 'baowu');
    }

    function renderHeroes(list) {
      const grid = document.getElementById('heroGrid');
      grid.innerHTML = '';
      if (!list.length) {
        grid.innerHTML = `<div class="no-result">— 沒有符合條件的英雄 —</div>`;
        return;
      }
      list.forEach(h => {
        const card = document.createElement('div');
        card.className = 'hero-card';
        card.setAttribute('data-rarity', h.rarity);
        card.innerHTML = `
          <div class="hero-name">${h.name}</div>
          <div class="hero-meta">
            <span class="rarity-dot"></span>${h.rarity}・${h.type}
          </div>
          <div class="hero-stats-mini">
            <div class="stat-chip">武<span>${h.force}</span></div>
            <div class="stat-chip">智<span>${h.intel}</span></div>
            <div class="stat-chip">魅<span>${h.charm}</span></div>
            <div class="stat-chip">統<span>${h.command}</span></div>
          </div>
        `;
        card.onclick = () => showModal(h);
        grid.appendChild(card);
      });
    }

    function filterHeroes() {
      const kw = document.getElementById('search').value.toLowerCase();
      let list = heroes;
      if (currentRarity !== "all") list = list.filter(h => h.rarity === currentRarity);
      if (currentJob    !== "all") list = list.filter(h => h.type   === currentJob);
      list = list.filter(h => h.name.toLowerCase().includes(kw));
      renderHeroes(list);
    }

    function filterByRarity(btn) {
      document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRarity = btn.dataset.filter;
      filterHeroes();
    }

    function filterByJob(btn) {
      document.querySelectorAll('.filter-btn[data-type]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentJob = btn.dataset.type;
      filterHeroes();
    }

    function showModal(h) {
      currentHero = h;
      document.getElementById('modalName').textContent = h.name;
      document.getElementById('modalRarityBar').style.background = rarityColor[h.rarity] || '#555';

      document.getElementById('modalTags').innerHTML = `
        <span class="modal-type-tag" style="background:${rarityBg[h.rarity]};color:${rarityColor[h.rarity]}">${h.rarity}</span>
        <span class="modal-type-tag" style="background:rgba(255,255,255,0.06);color:${jobColor[h.type]}">${h.type}</span>
      `;

      const stats = [
        { label: "武力", val: h.force },
        { label: "智力", val: h.intel },
        { label: "魅力", val: h.charm },
        { label: "統御", val: h.command },
      ];
      const reincarnHTML = h.reincarn && h.reincarn.length ? `
        <div class="reincarn-section">
          <div class="reincarn-label">輪　迴</div>
          <ul class="reincarn-list">
            ${h.reincarn.map(r => `<li class="reincarn-item">${r}</li>`).join('')}
          </ul>
        </div>
      ` : '';

      const destinyHTML = h.destiny && h.destiny.length ? `
        <div class="destiny-section">
          <div class="destiny-label">宿　命</div>
          <ul class="destiny-list">
            ${h.destiny.map(d => `<li class="destiny-item"><span class="destiny-name">${d.name}</span>（${d.hero}）${d.effect}</li>`).join('')}
          </ul>
        </div>
      ` : '';

      const awakenHTML = h.awakens && h.awakens.length ? `
        <div class="awaken-section">
          <div class="awaken-label">覺　醒</div>
          ${h.awakenName ? `<div class="awaken-name">${h.awakenName}</div>` : ''}
          <ul class="awaken-list">
            ${h.awakens.map(a => `<li class="awaken-item">${a}</li>`).join('')}
          </ul>
        </div>
      ` : '';

      const skillHTML = h.skills && h.skills.length ? `
        <div class="skill-section">
          <div class="skill-label">天　賦</div>
          ${h.skillName ? `<div class="skill-name">${h.skillName}</div>` : ''}
          <ul class="skill-list">
            ${h.skills.map(s => `<li class="skill-item">${s}</li>`).join('')}
          </ul>
        </div>
      ` : '';

      const talentHTML = h.talent ? `
        <div class="talent-section">
          <div class="talent-label">傳　記</div>
          <div class="talent-text">${h.talent}</div>
        </div>
      ` : '';

      document.getElementById('modalStats').innerHTML = stats.map(s => `
        <div class="stat-row">
          <span class="stat-label">${s.label}</span>
          <div class="stat-bar-wrap"><div class="stat-bar" style="width:${s.val}%"></div></div>
          <span class="stat-val">${s.val}</span>
        </div>
      `).join('') + talentHTML + skillHTML + awakenHTML + reincarnHTML + destinyHTML;

      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    let currentHero = null;
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) closeModal();
    });

    renderHeroes(heroes);
  </script>
