<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>皇者天下 - 英雄配裝工具</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c8a84b;
      --gold-bright: #e8c96a;
      --gold-dim: #7a6020;
      --bg-deep: #0a0c0a;
      --bg-panel: #0d120e;
      --bg-card: #111810;
      --bg-card-hover: #182018;
      --sidebar-w: 200px;
      --border: #1e2e1a;
      --text: #b8c8b0;
      --text-dim: #4a5e44;
    }

    body {
      font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }
    .baowu-slot {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 8px;
      text-align: center;
      transition: border-color 0.2s;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .baowu-slot:hover { border-color: var(--gold-dim); }
    .baowu-slot-type {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-dim);
      background: rgba(255,255,255,0.04);
      padding: 2px 8px;
      border-radius: 10px;
      width: 100%;
    }
    .baowu-slot-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold-bright);
      letter-spacing: 1px;
      line-height: 1.4;
    }
    .baowu-slot-effect {
      font-size: 11px;
      color: var(--text);
      line-height: 1.6;
      letter-spacing: 0.3px;
    }
    .skill-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 32px;
    }
    .skill-slot {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 10px;
      text-align: center;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.2s;
    }
    .skill-slot:hover { border-color: #4a8abf; }
    .skill-slot-name {
      font-size: 14px;
      font-weight: 700;
      color: #a0d4ff;
      letter-spacing: 1px;
    }
    .skill-slot-level {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }
    .skill-slot-empty {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .beast-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }
    .beast-col-label {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--gold-bright);
      text-align: center;
      margin-bottom: 8px;
      opacity: 0.7;
    }
    .beast-col { display: flex; flex-direction: column; gap: 8px; }
    .beast-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .beast-slot {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 10px;
      text-align: center;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: border-color 0.2s;
    }
    .beast-slot:hover { border-color: #8a5abf; }
    .beast-slot-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--text-dim);
      background: rgba(255,255,255,0.04);
      padding: 2px 8px;
      border-radius: 10px;
      width: 100%;
    }
    .beast-slot-name {
      font-size: 13px;
      font-weight: 700;
      color: #c0a0ff;
      letter-spacing: 1px;
    }
    .beast-slot-effect {
      font-size: 11px;
      color: var(--text);
      line-height: 1.6;
    }
    .beast-slot-empty {
      font-size: 11px;
      color: var(--text-dim);
      margin: auto;
    }

    .deputy-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 32px;
    }
    .deputy-slot:hover { border-color: var(--gold-dim); }
    .deputy-slot-label {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-dim);
      background: rgba(255,255,255,0.04);
      padding: 2px 8px;
      border-radius: 10px;
      width: 100%;
    }
    .deputy-slot-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--gold-bright);
      letter-spacing: 2px;
    }
    .deputy-slot-effect {
      font-size: 11px;
      color: var(--text);
      line-height: 1.6;
    }

    .baowu-slot-empty {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
      margin-top: auto;
      margin-bottom: auto;
    }

    /* ===== 左側選單 ===== */
    .sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0;
      z-index: 100;
    }

    .sidebar-logo {
      padding: 28px 20px 20px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .sidebar-logo .title {
      font-size: 24px;
      font-weight: 900;
      color: var(--gold-bright);
      letter-spacing: 4px;
      text-shadow: 0 0 18px rgba(255,215,0,0.4);
      line-height: 1.4;
    }
    .sidebar-logo .subtitle {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 2px;
      margin-top: 4px;
    }

    .sidebar-nav {
      padding: 16px 12px;
      flex: 1;
    }
    .nav-section-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--text-dim);
      padding: 8px 8px 6px;
      text-transform: uppercase;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-dim);
      transition: all 0.2s;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .nav-item:hover {
      background: var(--bg-card);
      color: var(--text);
    }
    .nav-item.active {
      background: rgba(212, 168, 75, 0.12);
      color: var(--gold-bright);
      border-color: rgba(212, 168, 75, 0.25);
      font-weight: 700;
    }
    .nav-item .icon {
      font-size: 18px;
      width: 22px;
      text-align: center;
    }
    .nav-item .badge {
      margin-left: auto;
      background: var(--gold-dim);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      letter-spacing: 1px;
    }

    /* ===== 主內容區 ===== */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      padding: 20px 32px 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-title {
      font-size: 28px;
      font-weight: 900;
      color: var(--gold-bright);
      letter-spacing: 3px;
      margin-bottom: 16px;
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-bottom: 16px;
    }
    .filter-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .filter-sep {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 4px;
    }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    .filter-btn:hover {
      border-color: var(--gold-dim);
      color: var(--text);
    }
    .filter-btn.active {
      background: rgba(212,168,75,0.15);
      border-color: var(--gold);
      color: var(--gold-bright);
      font-weight: 700;
    }

    .search-wrap {
      margin-left: auto;
      position: relative;
    }
    .search-wrap .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 14px;
    }
    #search, #baowuSearch {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 8px 16px 8px 34px;
      width: 200px;
      outline: none;
      transition: border-color 0.2s;
    }
    #search:focus, #baowuSearch:focus {
      border-color: var(--gold-dim);
    }
    #search::placeholder, #baowuSearch::placeholder {
      color: var(--text-dim);
    }

    /* ===== 英雄格 ===== */
    .content {
      padding: 24px 32px;
      flex: 1;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }
    .hero-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--rarity-color, var(--border));
      transition: opacity 0.2s;
      opacity: 0;
    }
    .hero-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--gold-dim);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .hero-card:hover::before { opacity: 1; }

    .hero-card[data-rarity="國士"] { --rarity-color: #d4a84b; }
    .hero-card[data-rarity="名將"] { --rarity-color: #7b9bd4; }
    .hero-card[data-rarity="良才"] { --rarity-color: #6daa6d; }
    .hero-card[data-rarity="巾幗"] { --rarity-color: #d4789a; }
    .hero-card[data-rarity="傳奇"] { --rarity-color: #ff6b35; }

    .rarity-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    [data-rarity="國士"] .rarity-dot { background: #d4a84b; }
    [data-rarity="名將"] .rarity-dot { background: #7b9bd4; }
    [data-rarity="良才"] .rarity-dot { background: #6daa6d; }
    [data-rarity="巾幗"] .rarity-dot { background: #d4789a; }
    [data-rarity="傳奇"] .rarity-dot { background: #ff6b35; }

    .hero-name {
      font-size: 20px;
      font-weight: 700;
      color: #e8d9b0;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .hero-meta {
      font-size: 14px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }
    .hero-stats-mini {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }
    .stat-chip {
      font-size: 13px;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255,255,255,0.05);
      color: var(--text-dim);
    }
    .stat-chip span { color: var(--text); font-weight: 700; }

    .no-result {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
      font-size: 16px;
      letter-spacing: 2px;
    }

    /* ===== 寶物頁 ===== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 20px;
      color: var(--text-dim);
      text-align: center;
      gap: 16px;
    }
    .empty-icon { font-size: 52px; opacity: 0.3; }
    .empty-title { font-size: 18px; letter-spacing: 3px; }
    .empty-sub { font-size: 13px; letter-spacing: 1px; }

    /* ===== Modal ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      backdrop-filter: blur(3px);
    }
    .modal-content {
      position: absolute;
      top: 0; right: 0;
      width: min(520px, 100%);
      height: 100%;
      background: var(--bg-panel);
      border-left: 1px solid var(--gold-dim);
      overflow-y: auto;
      box-shadow: -8px 0 40px rgba(0,0,0,0.6);
      animation: slideIn 0.28s cubic-bezier(0.22,1,0.36,1);
      display: flex;
      flex-direction: column;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0.5; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    .modal-header {
      background: linear-gradient(160deg, rgba(200,168,75,0.12), rgba(200,168,75,0.02));
      padding: 36px 32px 24px;
      border-bottom: 1px solid var(--border);
      position: relative;
      flex-shrink: 0;
    }
    .modal-rarity-bar {
      height: 3px;
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .modal-name {
      font-size: 34px;
      font-weight: 900;
      color: var(--gold-bright);
      letter-spacing: 4px;
      margin-bottom: 10px;
    }
    .modal-type-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 14px;
      letter-spacing: 2px;
      margin-right: 6px;
    }
    .close-btn {
      position: absolute;
      top: 20px; right: 24px;
      font-size: 26px;
      cursor: pointer;
      color: var(--text-dim);
      transition: color 0.2s;
      background: none;
      border: none;
      font-family: inherit;
      line-height: 1;
    }
    .close-btn:hover { color: var(--gold-bright); }

    .modal-body { padding: 28px 32px 40px; flex: 1; }
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 17px;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--text-dim); letter-spacing: 1px; }
    .stat-bar-wrap { flex: 1; margin: 0 16px; height: 4px; background: var(--border); border-radius: 2px; }
    .stat-bar { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright)); transition: width 0.6s ease; }
    .stat-val { font-weight: 700; color: var(--gold-bright); min-width: 30px; text-align: right; font-size: 18px; }

    .skill-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .skill-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .skill-name {
      font-size: 18px;
      font-weight: 900;
      color: var(--gold-bright);
      letter-spacing: 3px;
      margin-bottom: 12px;
    }
    .skill-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .skill-item {
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
      letter-spacing: 0.5px;
      background: rgba(255,255,255,0.03);
      border-left: 2px solid #c8a84b;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      position: relative;
    }

    .awaken-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .awaken-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .awaken-name {
      font-size: 18px;
      font-weight: 900;
      color: #a0d4ff;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }
    .awaken-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .awaken-item {
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
      letter-spacing: 0.5px;
      background: rgba(100,160,255,0.05);
      border-left: 2px solid #4a8abf;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
    }

    .reincarn-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .reincarn-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .reincarn-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .reincarn-item {
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
      letter-spacing: 0.5px;
      background: rgba(180,120,255,0.05);
      border-left: 2px solid #8a5abf;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
    }

    .destiny-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .destiny-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .destiny-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .destiny-item {
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
      letter-spacing: 0.5px;
      background: rgba(255,160,80,0.05);
      border-left: 2px solid #bf7a30;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
    }
    .destiny-name {
      color: #e8c080;
      font-weight: 700;
    }

    .note-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .note-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .note-text {
      font-size: 15px;
      color: var(--text);
      line-height: 1.9;
      letter-spacing: 1px;
      background: rgba(255,255,255,0.03);
      border-left: 2px solid #4a7a4a;
      padding: 12px 16px;
      border-radius: 0 6px 6px 0;
      font-style: italic;
    }
    .note-empty {
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 1px;
      font-style: italic;
      padding: 8px 0;
    }

    .talent-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .talent-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .talent-text {
      font-size: 16px;
      color: var(--text);
      line-height: 1.8;
      letter-spacing: 1px;
      background: rgba(255,255,255,0.03);
      border-left: 2px solid var(--gold-dim);
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
    }

    /* ===== 動畫效果 ===== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes ripple {
      0%   { transform: scale(0); opacity: 0.5; }
      100% { transform: scale(4); opacity: 0; }
    }
    @keyframes pageFade {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* 卡片載入動畫 */
    .hero-card, .baowu-card-anim {
      animation: fadeInUp 0.35s ease both;
    }

    /* 頁面切換淡入 */
    .page-enter {
      animation: pageFade 0.25s ease both;
    }

    /* 漣漪效果 */
    .ripple-wrap {
      position: relative;
      overflow: hidden;
    }
    .ripple-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(212, 168, 75, 0.25);
      width: 20px;
      height: 20px;
      margin-top: -10px;
      margin-left: -10px;
      animation: ripple 0.6s linear;
      pointer-events: none;
    }

  </style>
</head>
<body>

  <!-- 左側選單 -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="title">皇者天下</div>
      <div class="subtitle">配裝工具</div>
    </div>

      { id:"liushan", name:"神·劉禪", type:"文官", rarity:"國士", force:79, intel:91, charm:97, command:88, talent:"幼年劫難有驚無險，順繼蜀漢群臣環伺。至尊強運當屬阿斗，樂不思蜀有苦自知。", skillName:"福澤後主", skills:["可擔當任意英雄的任意兵種副將","作為副將時，可依照劉禪品質，為主將提供額外加成","受到反噬類效果時，減免 15% 損失；紫色以上品質：近戰回合受到的傷害 -5%；金色以上品質：魅力 +1，統御 +1；紅色品質：遠戰回合受到的傷害 -5%；劉禪自身作為主將時，更可依照品質，解鎖以上全部 4 倍的加成效果"], awakens:["從戰鬥開始起，每回合我方英雄行動結束時，若我方存在至少 1 個增益狀態，可發動【樂不思蜀】，消滅敵方前軍和後軍最大兵力的 8%","若【福佑】達到 20 級，智力 +5，魅力 +5，【福佑】在戰鬥開始時的發動幾率 +30%，且近戰首回合可額外發動一次【福佑】"], reincarn:["敵方發動任意英雄技時，若其兵力不足一半，則劉禪發動【大智若愚】，阻止敵方技能發動","英雄可自由分配四維 +2","英雄主動技能位 +1","全軍免傷 +8%","英雄可自由分配四維 +4"], destiny:[{name:"亞父守護",hero:"諸葛亮",effect:"同時上陣，福佑的護盾量提升 300%"},{name:"單騎救主",hero:"趙雲",effect:"對武將傷害 +20%"},{name:"賢內勇外",hero:"張星彩",effect:"傷害 +10%"},{name:"虎父犬子",hero:"劉備",effect:"受到傷害 -10%"}]},

	{ id:"huangchengyan", name:"神·黃承彥", type:"全才", rarity:"傳奇", force:68, intel:92, charm:94, command:100, talent:"黃月英之父，諸葛亮岳父，通吃襄陽名士圈。擅長陣法軍略，興趣是遛彎救人破八陣圖。", skillName:"陣法宗師", skills:["作為方士副將時，副將主動技鎖定為【洪荒八陣】：近戰首回合發動，對敵方全軍造成傷害，並有 20% 的幾率使之【混亂】 1 回合；命中後若敵方任意部隊處於不良狀態，可再額外發動 1 次【洪荒八陣】", "若主將四維高於對手，【洪荒八陣】有 50% 的幾率額外導致目標【火災】 1 回合", "黃承彥自身作為主將時，遠戰第二回合和近戰首回合都可聯合我方方士發動【洪荒八陣】，且每提升 1 級任意陣法，【洪荒八陣】傷害 +2%"], legendary:"主公麾下所有英雄，前軍格擋率 +?", awakens:["作為副將時，若敵方啟動的陣法與我方相同，造成的傷害 +20%", "作為副將時，主將四維各 +1"], reincarnation:[], destiny:[{name:"鼎力相助", hero:"陸遜", effect:"對女性英雄傷害 +10%"}, {name:"父愛如山", hero:"黃月英", effect:"對文官傷害 +15%"}, {name:"翁婿之情", hero:"諸葛亮", effect:"受到文官傷害 -15%"}, {name:"莫逆之交", hero:"司馬徽", effect:"對步兵傷害 +20%"}], skin:[], initSkills:[{name:"不屈", lv:8}, {name:"軍略", lv:10}, {name:"農耕", lv:5}] },
	{ id:"sunjian", name:"神·孫堅", type:"武將", rarity:"傳奇", force:98, intel:80, charm:90, command:97, talent:"容貌不凡，性闊達，好奇節。年少時計破海盜，成年後斬華雄、破董卓，悍勇非常。", skillName:"威震涵洛", skills:["遠戰每回合結束時，治療我方前軍 50% 的傷兵", "我方前軍受到敵方部隊的近身攻擊時，可觸發【刺甲】效果，將所受的傷害 100% 反震給敵方", "每提升 1 級【蓄勢】，前後軍基礎兵力 +14，近戰回合傷害 +2%"], legendary:"主公麾下所有英雄，英雄技免傷 +?", awakens:["智力 +7，統御 +3，我方的護盾、治療、增援兵力類效果 +50%", "【刺甲】進化為【怒盾】，可將所受的近身傷害 200% 反震給敵方，並且每觸發一次【怒盾】，前軍攻擊 +5%（最多提升 30%）"], reincarnation:["我方前軍受到敵方部隊的近身攻擊後，有 50% 的機率額外觸發【鐵衣】，為我方前軍召喚自身最大兵力 10% 的護盾（最多觸發 3 次）", "英雄可自由分配四維 +2", "英雄主動技能位 +1", "全軍免傷 +8%", "英雄可自由分配四維 +4"], destiny:[{name:"威震涵洛", hero:"孫權", effect:"英雄技免傷 +15%，受到英雄技能傷害 -15%"}, {name:"父子連心", hero:"孫策", effect:"對全才傷害 +25%"}, {name:"血脈相連", hero:"孫尚香", effect:"對文官傷害 +15%"}, {name:"吳中脊樑", hero:"吳國太", effect:"前軍基礎兵力 +200"}], skin:[], initSkills:[{name:"金剛", lv:10}, {name:"行軍", lv:5}, {name:"蓄勢", lv:7}] },
	{ id:"zhangliang", name:"神·張良", type:"文官", rarity:"傳奇", force:73, intel:100, charm:97, command:95, talent:"張良，字子房，漢初三傑之一。在楚漢戰爭中「長計謀平天下」，都為劉邦所採納。", skillName:"遠見卓識", skills:["遠戰第二回合發動【謀聖無疆】，驅散對方所有護盾，並對敵方全軍造成 150% 傷害。【謀聖無疆】發動前，敵方每發動 1 次英雄技，【謀聖無疆】的傷害強度提升 50", "若四維總數高於對手，【謀聖無疆】可在近戰首回合額外發動 1 次", "每提升 1 級【乾坤】，全軍傷害 +1%，免傷 +1%"], legendary:"主公麾下所有英雄，英雄攻擊時忽視目標 ?% 的防禦", awakens:["對陣文官時，可吸取敵方英雄 30 點智力，且【謀聖無疆】可在遠戰首回合額外發動一次", "發動【謀聖無疆】時，有 30% 機率導致目標【挫志】，持續 1 回合，期間部隊無法行動，並降低 40% 臨場防禦"], reincarnation:["我方每次主動發動英雄、兵種或天賦技，全軍攻擊 +2%（最多提升 30%）", "英雄可自由分配四維 +2", "英雄主動技能位 +1", "全軍傷害 +8%", "英雄可自由分配四維 +4"], destiny:[{name:"遠見卓識", hero:"張角", effect:"英雄技能傷害 +20%"}, {name:"運籌帷幄", hero:"諸葛亮", effect:"對武將傷害 +20%"}, {name:"人中龍鳳", hero:"韓信", effect:"受到文官傷害 -20%"}, {name:"相見恨晚", hero:"劉邦", effect:"基礎攻擊 +100，基礎防禦 +50"}], skin:[], initSkills:[{name:"地刺", lv:7}, {name:"乾坤", lv:10}, {name:"集智", lv:5}] },
	{ id:"xiangyu", name:"神·項羽", type:"武將", rarity:"傳奇", force:100, intel:76, charm:93, command:98, talent:"曾領軍滅亡秦國。自稱西楚霸王，大封滅秦功臣將領，擁立六國貴族後代為王。", skillName:"西楚霸王", skills:["若敵方僅剩單軍，則立即發動【楚霸天威】，對敵方剩餘部隊進行一次毀滅性打擊，造成 900% 傷害", "對敵方前軍造成的所有傷害提高 60%", "若武力高於對手，我方全軍的不良狀態抗性 +50%", "每提升 1 點武力，前後軍基礎攻擊 +2，【沖陣】的傷害強度 +2%"], legendary:"主公麾下所有英雄，對敵方前軍傷害 +?", awakens:["每提升 3 點非武力四維，武力 +1", "【沖陣】可無視敵方 30% 防禦，並忽略敵方被動技能，且可額外連發一次"], reincarnation:["武力每比對手高 1，所有與武力相關的英雄技，對敵方前軍傷害 +2%（最多 100%）", "英雄可自由分配四維 +2", "英雄主動技能位 +1", "英雄技傷害 +20%", "英雄可自由分配四維 +4"], destiny:[{name:"西楚霸王", hero:"呂布", effect:"【沖陣】可攻擊敵方全體"}, {name:"勇冠三軍", hero:"趙雲", effect:"對全才傷害 +25%"}, {name:"楚漢相爭", hero:"劉邦", effect:"對步兵傷害 +30%"}, {name:"心頭之患", hero:"韓信", effect:"敵方全軍免傷 -15%"}], skin:[], initSkills:[{name:"沖陣", lv:10}, {name:"暴烈", lv:5}, {name:"切割", lv:7}] },
	{ id:"yuji", name:"神·虞姬", type:"全才", rarity:"傳奇", force:76, intel:94, charm:100, command:92, talent:"楚漢之爭時期西楚霸王項羽的美人，曾在四面楚歌的困境下一直陪伴在項羽身邊。最終在楚營內自刎，流傳了一段「霸王別姬」的傳說。", skillName:"霸王別姬", skills:["每次發動英雄技後，翩翩起舞擾亂敵軍，使敵方前軍或後軍進入【魅惑】特殊效果，攻擊 -30%。若同一部隊再次被【魅惑】，則解除【魅惑】，並將此部隊 30% 的當前兵力引誘到我方陣中","兵力高於對手時，造成的所有傷害 +25%","每提升 1 級【退避】，前後軍基礎防禦 +5"], awakens:["魅力 +5，我方魅力每比對手高 1，全軍攻擊 +1%（最多 50%）","若我方任意技能被敵方阻止，我方發動【紅顏一笑】禮尚往來，使敵方全軍進入【魅惑】特殊效果"], destiny:[{name:"霸王別姬",hero:"項羽",effect:"遠戰回合免傷 +20%"},{name:"嬌豔欲滴",hero:"貂蟬",effect:"對文官傷害 +25%"},{name:"美人花開",hero:"呂布",effect:"受到男性英雄傷害 -20%"},{name:"心亂神迷",hero:"劉邦",effect:"後軍兵力 +2,000"}] },

{ id:"liubang", name:"神·劉邦", type:"文官", rarity:"傳奇", force:77, intel:95, charm:90, command:95, talent:"漢朝開國皇帝，楚漢戰爭時期，聯合各地反對項羽的力量反敗為勝，擊敗項羽後統一天下。", skillName:"天命真龍", skills:["作為副將，且敵方主將為男性時，可額外發動【急脫鴻門】：我方受到傷害後若兵力低於 25% 立即發動，增援我方全軍 5% 的最大兵力，並驅散全部不良狀態（每場對決限一次）","若我方戰力低於對手，發動【急脫鴻門】時可額外增援我方全軍 10% 的最大兵力"], awakens:["作為副將時，主將前後軍的攻擊，可無視目標 10% 防禦","【急脫鴻門】發動時，我方全軍每存在 1 種不良狀態，【急脫鴻門】的增援效果 +20%"], destiny:[{name:"天命真龍",hero:"劉備",effect:"傷害 +15%"},{name:"南征北討",hero:"關羽",effect:"受到武將傷害 -25%"},{name:"亦敵亦友",hero:"項羽",effect:"對武將傷害 +25%"},{name:"共謀天下",hero:"張良",effect:"攻擊 +10%、防禦 +10%"}] },

{ id:"hanxin", name:"神·韓信", type:"全才", rarity:"傳奇", force:83, intel:97, charm:89, command:100, talent:"韓信熟諳兵法，作為戰術家為後世留下了大量的戰術典故，如明修棧道，暗渡陳倉等。被後人奉為「兵仙」、「神帥」。", skillName:"兵仙神帥", skills:["敵方全軍發動任意與武力相關的主動技時，有 50% 幾率發動【兵無常勢】，阻止敵方發動此技能（此效果不消耗無懈次數）","每觸發一次【兵無常勢】，我方全軍傷害提高 10%（最多提升 50%）","每提升 3 點非統禦的四維，統禦 +1，且【兵無常勢】的發動幾率 +1%"], awakens:["若統御高於對手，敵方發動任意戰計時也可發動【兵無常勢】，禁止敵方發動此戰計","【兵無常勢】累計發動 5 次後，額外發動【水無常形】，消滅敵方全軍 35% 最大兵力"], destiny:[{name:"兵仙神帥",hero:"曹操",effect:"對男性英雄傷害 +15%"},{name:"百戰百勝",hero:"陸遜",effect:"受到全才傷害 -25%"},{name:"大材小用",hero:"項羽",effect:"對騎兵傷害 +30%"},{name:"漢初三傑",hero:"張良",effect:"受到傷害 -15%"}] },

{ id:"gongsunzan", name:"神·公孫瓚", type:"全才", rarity:"傳奇", force:96, intel:90, charm:88, command:94, talent:"大儒盧植弟子，劉備的師兄。長年虎踞北塞，擁有數千名為白馬義從的精銳騎兵，是三國早期實力最為雄厚的諸侯之一。", skillName:"白馬將軍", skills:["我方所有兵種主動技，都可提前一回合釋放，最早提前到戰鬥開始，且威力 +20%","我方部隊行動前，若自身不存在不良狀態，原本在本回合的兵種主動技也可照常發動","每提升 1 級【焱雨】，前後軍基礎攻防 +6，不良狀態抗性 +1%"], awakens:["戰鬥中，騎兵額外獲得 20 級【衝鋒】技能，弓兵額外獲得 20 級【地刺】技能","戰鬥中，每發動一次兵種主動技，被動提升全軍 4% 攻擊（最多 60%）"], destiny:[{name:"白馬義從",hero:"趙雲",effect:"前後軍的不良狀態抗性 +5%"},{name:"北地爭雄",hero:"袁紹",effect:"對文官傷害 +25%"},{name:"猿臂善射",hero:"呂布",effect:"受到文官傷害 -25%"},{name:"師出同門",hero:"劉備",effect:"前後軍傷害各 +5%、前軍傷害 +5%、後軍傷害 +5%"}] },

{ id:"wangzhaojun", name:"神·王昭君", type:"武將", rarity:"傳奇", force:94, intel:80, charm:100, command:90, talent:"中國古代四大美女之一，擁有沉魚落雁之貌。昭君奉帝命和親南匈奴，為兩國帶來了長久的和平，史稱昭君出塞。", skillName:"昭君出塞", skills:["遠戰首回合起，步兵每回合都可發動 1 次【陷陣】，且不自損兵力","我方英雄技及兵種技造成的每段傷害，都有 30% 的機率驅散目標 1 個增益狀態","遠戰首回合起，敵方部隊行動前若自身不存在增益狀態，則觸發【落雁】損失 30% 的當前兵力，且無法發動本回合的兵種主動技","每提升 2 點魅力，武力 +1，前後軍速度各 +1"], awakens:["遠戰首回合起，弓兵每回合都可發動 1 次【齊射】","敵方部隊若不存在增益狀態，所受傷害 +20%"], destiny:[{name:"傾國傾城",hero:"貂蟬",effect:"前軍英雄技能傷害 +15%、後軍英雄技能傷害 +15%"},{name:"匈奴王妃",hero:"蔡文姬",effect:"對男性英雄傷害 +20%"},{name:"平沙落雁",hero:"漢獻帝",effect:"受到男性英雄傷害 -20%"},{name:"漢宮傳奇",hero:"王越",effect:"前後軍可分別豁免一次導致全滅的攻擊傷害"}] },

function renderSkills(filteredSkills) {
  const grid = document.getElementById('skillGrid');
  grid.innerHTML = '';
  
  filteredSkills.forEach(skill => {
    const card = document.createElement('div');
    card.className = 'skill-slot ripple-wrap';
    card.style.cssText = `
      background: #111810;
      border: 1px solid #1e2e1a;
      border-radius: 10px;
      padding: 16px 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      min-height: 108px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    `;
    card.innerHTML = `
      <div style="font-size:17px; font-weight:700; color:#e8d9b0; margin-bottom:10px;">${skill.name}</div>
      <div style="font-size:13px; padding:5px 12px; background:rgba(255,255,255,0.06); border-radius:20px; color:#a0c080; margin:0 auto; width:fit-content;">${skill.type}</div>
    `;
    card.addEventListener('click', e => { 
      addRipple(e, card); 
      showSkillModal(skill); 
    });
    card.addEventListener('mouseenter', () => card.style.borderColor = '#c8a84b');
    card.addEventListener('mouseleave', () => card.style.borderColor = '#1e2e1a');
    grid.appendChild(card);
  });
}
function showSkillModal(skill) {
  document.getElementById('modalName').textContent = skill.name;
  document.getElementById('modalRarityBar').style.background = '#6a9b5a';
  document.getElementById('modalTags').innerHTML = `<span class="modal-type-tag" style="background:rgba(106,155,90,0.2);color:#a0d090;">${skill.type}技能</span>`;
  
  document.getElementById('modalStats').innerHTML = `
    <div class="skill-section">
      <div class="skill-label">等級1</div>
      <div class="skill-item" style="font-size:15px;">${skill.lv1}</div>
    </div>
    <div class="skill-section">
      <div class="skill-label">等級30</div>
      <div class="skill-item" style="font-size:15px;color:#ffcc66;">${skill.lv30}</div>
    </div>
  `;
  document.getElementById('modal').style.display = 'flex';
}

function filterSkillType(type) {
  document.querySelectorAll('#skillPage .filter-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  let list = troopSkills;
  if (type !== 'all') list = list.filter(s => s.type === type);
  renderSkills(list);
}

function filterSkills() {
  const kw = document.getElementById('skillSearch').value.toLowerCase();
  let list = troopSkills.filter(s => s.name.toLowerCase().includes(kw) || s.lv1.toLowerCase().includes(kw));
  renderSkills(list);

        const card = document.createElement('div');
        card.className = 'hero-card ripple-wrap';

    function addRipple(e, el) {
      const circle = document.createElement('span');
      circle.className = 'ripple-circle';
      const rect = el.getBoundingClientRect();
      circle.style.left = (e.clientX - rect.left) + 'px';
      circle.style.top  = (e.clientY - rect.top)  + 'px';
      el.appendChild(circle);
      circle.addEventListener('animationend', () => circle.remove());
    }

    function switchTab(tab) {
      allTabs.forEach(t => {
        const page = document.getElementById(t + 'Page');
        if (page) {
          page.style.display = t === tab ? 'block' : 'none';
          if (t === tab) {
            page.classList.remove('page-enter');
            void page.offsetWidth;
            page.classList.add('page-enter');
          }
        }
        const nav = document.getElementById(tabNavMap[t]);
        if (nav) nav.classList.toggle('active', t === tab);
      });
      if (tab === 'baowu') filterBaowuList();
    }

function renderBattleplans(filteredList) {
  const grid = document.getElementById('battleplanGrid');
  grid.innerHTML = '';
  
  if (!filteredList.length) {
    grid.innerHTML = `<div class="no-result">— 沒有找到相關戰計 —</div>`;
    return;
  }

  filteredList.forEach(bp => {
    const card = document.createElement('div');
    card.className = 'hero-card ripple-wrap';
    card.innerHTML = `
      <img src="${bp.img}" alt="${bp.name}" style="width:100%; height:180px; object-fit:cover; border-radius:8px; margin-bottom:12px;">
